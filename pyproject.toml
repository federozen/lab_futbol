[project]
name = "laboratorio-futbol-argentino"
version = "1.0.0"
description = "Laboratorio descriptivo y explicable del futbol argentino, con scraping publico y sin Opta obligatorio."
requires-python = ">=3.12,<3.14"
readme = "README.md"
dependencies = [
    "streamlit==1.63.0",
    "pandas==2.2.3",
    "numpy==2.3.5",
    "requests==2.32.5",
    "matplotlib==3.10.8",
    "scipy==1.17.0",
    "lxml==6.1.1",
    "beautifulsoup4==4.14.3",
    "html5lib==1.1",
    "plotly==6.5.2",
    "networkx==3.6.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff>=0.5,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9"]
